[package]
name = "widgetcore-desktop"
version = "0.1.0"
description = "WidgetCore Windows Desktop Hub"
authors = ["WidgetCore"]
edition = "2021"

[lib]
name = "widgetcore_desktop_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
